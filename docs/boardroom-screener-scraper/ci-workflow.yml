name: Boardroom Screener scraper
on:
  push:
    paths: ['scrapers/**', '.github/workflows/boardroom-screener-scraper.yml']
  pull_request:
    paths: ['scrapers/**', '.github/workflows/boardroom-screener-scraper.yml']
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r scrapers/requirements.txt
      - run: python -m unittest discover -s scrapers/tests -v
